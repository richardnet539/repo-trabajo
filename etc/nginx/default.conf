server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.php index.html index.htm;

    server_name _;

    # Add Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # Commented out HSTS since it's only relevant for HTTPS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Preconnect to external resources
    add_header Link "<https://fonts.googleapis.com/css?display=swap&family=Lato%3A300,400>; rel=preconnect" always;
    add_header Link "<https://fonts.googleapis.com/css?family=Muli:300,400,600,700&display=swap>; rel=preconnect" always;
    add_header Link "<https://cookie-cdn.cookiepro.com/consent/018e9a60-e772-7722-82c3-98dae004d75e/OtAutoBlock.js>; rel=preconnect" always;
    add_header Link "<https://cookie-cdn.cookiepro.com/scripttemplates/otSDKStub.js>; rel=preconnect" always;
    add_header Link "<https://cdn.jsdelivr.net>; rel=preconnect" always;
    add_header Link "<https://use.fontawesome.com>; rel=preconnect" always;
    add_header Link "<https://stackpath.bootstrapcdn.com>; rel=preconnect" always;
    add_header Link "<https://cdnjs.cloudflare.com>; rel=preconnect" always;

    # Preload critical CSS and JS
    add_header Link "<https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css?ver=6.6.2>; rel=preload; as=style" always;
    add_header Link "<https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js?ver=1.8.1>; rel=preload; as=script" always;
    add_header Link "<https://use.fontawesome.com/releases/v5.6.3/css/all.css?ver=6.6.2>; rel=preload; as=style" always;
    add_header Link "<https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css?ver=6.6.2>; rel=preload; as=style" always;
    add_header Link "<https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.css?ver=6.6.2>; rel=preload; as=style" always;
    add_header Link "<https://ligadedebate-wuyvulatdq-ew.a.run.app/wp-includes/css/dist/block-library/style.min.css?ver=6.6.2>; rel=preload; as=style" always;
    add_header Link "<https://ligadedebate-wuyvulatdq-ew.a.run.app/wp-content/themes/ligadedebate/style.css?ver=6.6.2>; rel=preload; as=style" always;
    add_header Link "<https://ligadedebate-wuyvulatdq-ew.a.run.app/wp-includes/js/jquery/jquery.min.js?ver=3.7.1>; rel=preload; as=script" always;

    # Preload images
    add_header Link "<https://storage.googleapis.com/liga-de-debate-media/2024/07/126f7a58-home-banner.png>; rel=preload; as=image" always;
    add_header Link "<https://storage.googleapis.com/liga-de-debate-media/2024/10/6e5fede6-slider-liga-debate-universitaria-es-veinte-cuatro-1.webp>; rel=preload; as=image" always;

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP scripts to FastCGI server
     location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm82.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        
        # FastCGI Cache Configuration
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 301 302 60m;
        add_header X-FastCGI-Cache $upstream_cache_status;

        # FastCGI Optimization
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 180;
        fastcgi_read_timeout 180;

        # Serve cached pages for certain status codes
        fastcgi_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
    }

    # Set long cache for static files
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|tff|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }

    # Block access to sensitive files
    location ~* ^/(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # Handle REST API requests
    location ~ ^/wp-json/ {
        rewrite ^/wp-json/(.*?)$ /index.php?$args last;
    }

    # Handle wp-admin requests
    location /wp-admin {
        try_files $uri $uri/ /index.php?$args;
    }
}
