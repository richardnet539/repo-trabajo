server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.php index.html index.htm;

    server_name _;

    # Add Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # Commented out HSTS since it's only relevant for HTTPS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;


    # Define Nginx temporary file paths
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP scripts to FastCGI server
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm82.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;

        # FastCGI Optimization
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 180;
        fastcgi_read_timeout 180;
    }

    # Set long cache for static files
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|tff|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }

    # Block access to sensitive files
    location ~* ^/(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # Handle REST API requests
    location ~ ^/wp-json/ {
        rewrite ^/wp-json/(.*?)$ /index.php?$args last;
    }

    # Handle wp-admin requests
    location /wp-admin {
        try_files $uri $uri/ /index.php?$args;
    }
}