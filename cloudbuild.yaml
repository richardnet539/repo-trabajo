steps:
  # Step 1: Ensure the Compute Engine instance exists, create if it doesn't
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Ensure Compute Instance'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if ! gcloud compute instances describe $_INSTANCE_NAME --zone $_ZONE 2>/dev/null; then
          gcloud compute instances create $_INSTANCE_NAME \
            --zone=$_ZONE \
            --machine-type=e2-small \
            --image-family=debian-10 \
            --image-project=debian-cloud \
            --tags=http-server,https-server \
            --metadata=startup-script='#! /bin/bash
            sudo apt update && sudo apt -y upgrade
            sudo apt -y install apache2 php mariadb-server libapache2-mod-php php-mysql
            sudo systemctl enable apache2
            sudo systemctl enable mariadb
            ';
        fi

  # Step 2: Copy only the Makefile to the VM
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Copy Makefile'
    args:
      - compute
      - scp
      - Makefile
      - $_GCE_USERNAME@$_INSTANCE_NAME:/var/www/html/
      - --zone=$_ZONE
      - --project=$_PROJECT_ID

  # Step 3: Execute Makefile commands on the instance to set up the environment and WordPress
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Run Makefile Commands'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='
          sudo apt-get install -y make
          sudo make -C /var/www/html/ -f Makefile all
        '

  # Step 4: Copy the rest of the theme files to the instance
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Copy Theme Files'
    args:
      - compute
      - scp
      - --recurse
      - .
      - $_GCE_USERNAME@$_INSTANCE_NAME:/var/www/html/wordpress/wp-content/themes/$_THEME_NAME
      - --zone=$_ZONE
      - --project=$_PROJECT_ID
    dir: '!' # Exclude Makefile from this copy operation

timeout: '1600s' # Adjust the timeout based on your needs

substitutions:
  _INSTANCE_NAME: 'your-instance-name'
  _ZONE: 'your-zone'
  _GCE_USERNAME: 'your-gce-username'
  _THEME_NAME: 'your-theme-name'
  _PROJECT_ID: 'your-project-id'
