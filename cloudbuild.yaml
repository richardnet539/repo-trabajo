steps:
  # Step 1: Ensure the Compute Engine instance exists, create if it doesn't
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Ensure Compute Instance'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if ! gcloud compute instances describe $_INSTANCE_NAME --zone $_ZONE 2>/dev/null; then
          gcloud compute instances create $_INSTANCE_NAME \
            --zone=$_ZONE \
            --machine-type=e2-small \
            --image-family=debian-10 \
            --image-project=debian-cloud \
            --tags=http-server,https-server \
            --metadata=startup-script='#! /bin/bash
            sudo apt update && sudo apt -y upgrade
            sudo apt -y install apache2 php mariadb-server libapache2-mod-php php-mysql
            sudo systemctl enable apache2
            sudo systemctl enable mariadb
            ';
        fi

    # Step 2: Ensure Apache, PHP, and MariaDB are installed on the VM
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Ensure Dependencies'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='
          sudo apt-get update && \
          sudo apt-get install -y apache2 php mariadb-server libapache2-mod-php php-mysql && \
          sudo systemctl enable apache2 && \
          sudo systemctl enable mariadb && \
          sudo systemctl start apache2 && \
          sudo systemctl start mariadb
        '

   # Step 3: Copy only the Makefile to the VM's home directory
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Copy Makefile'
    args:
      - compute
      - scp
      - Makefile
      - $_GCE_USERNAME@$_INSTANCE_NAME:~/
      - --zone=$_ZONE
      - --project=$_PROJECT_ID

  # Step 3: Ensure /var/www/html/ exists (wait for startup script to finish)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Wait for Startup Script'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        until gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='test -d /var/www/html/'; do
          echo "Waiting for /var/www/html/ to be available..."
          sleep 10
        done

  # Step 5: Execute Makefile commands now assumes Makefile is in the home directory
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Run Makefile Commands'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='
          sudo apt-get install -y make
          sudo make -C ~ -f Makefile all
        '

  # Step 6: Copy the rest of the theme files to the instance
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Prepare Theme Archive'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        tar --exclude=Makefile --exclude=.tar.gz -czf theme-archive.tar.gz .

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Copy Theme Archive'
    args:
      - compute
      - scp
      - theme-archive.tar.gz
      - $_GCE_USERNAME@$_INSTANCE_NAME:~/
      - --zone=$_ZONE
      - --project=$_PROJECT_ID
      
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Extract Theme Archive'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='
          sudo mkdir -p /var/www/html/wordpress/wp-content/themes/$_THEME_NAME;
          sudo tar -xzf theme-archive.tar.gz -C /var/www/html/wordpress/wp-content/themes/$_THEME_NAME;
          rm theme-archive.tar.gz;
        '

timeout: '1600s'  

options:
  logging: CLOUD_LOGGING_ONLY

tags: 
 - master


