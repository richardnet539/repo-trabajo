steps:
  # Step 1: Prepare the Theme Archive
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Prepare Theme Archive'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        touch theme-archive.tar.gz
        tar --exclude=theme-archive.tar.gz -zcvf theme-archive.tar.gz .


  # Step 2: Ensure the Compute Engine instance exists, create if it doesn't
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Ensure Compute Instance'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if ! gcloud compute instances describe $_INSTANCE_NAME --zone $_ZONE 2>/dev/null; then
          gcloud compute instances create $_INSTANCE_NAME \
            --zone=$_ZONE \
            --machine-type=e2-small \
            --image-family=debian-10 \
            --image-project=debian-cloud \
            --tags=http-server,https-server \
            --metadata=startup-script='#! /bin/bash
            sudo apt update && sudo apt -y upgrade
            sudo apt -y install apache2 php mariadb-server libapache2-mod-php php-mysql
            sudo systemctl enable apache2
            sudo systemctl enable mariadb
            ';
        fi

    # Step 3: Ensure Apache, PHP, and MariaDB are installed on the VM
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Ensure Dependencies'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='
          sudo apt-get update && \
          sudo apt-get install -y apache2 php mariadb-server libapache2-mod-php php-mysql && \
          sudo systemctl enable apache2 && \
          sudo systemctl enable mariadb && \
          sudo systemctl start apache2 && \
          sudo systemctl start mariadb
        '

   # Step 4: Copy only the Makefile to the VM's home directory, if no PHP files exist
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Copy Makefile Conditionally'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if ! gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='find /var/www/html/ -type f -name "*.php" | grep -q .'; then
          gcloud compute scp Makefile $_GCE_USERNAME@$_INSTANCE_NAME:~/ --zone=$_ZONE --project=$_PROJECT_ID
        else
          echo "PHP files detected in /var/www/html/, skipping Makefile copy."
        fi

  # Step 5: Execute Makefile commands conditionally
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Run Makefile Commands Conditionally'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if ! gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='find /var/www/html/ -type f -name "*.php" | grep -q .'; then
          gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='sudo apt-get install -y make && sudo make -C ~ -f Makefile all'
        else
          echo "PHP files detected in /var/www/html/, skipping Makefile execution."
        fi

  # Step 6: Copy the rest of the theme files to the instance
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Copy Theme Archive'
    args:
      - compute
      - scp
      - theme-archive.tar.gz
      - $_GCE_USERNAME@$_INSTANCE_NAME:~/
      - --zone=$_ZONE
      - --project=$_PROJECT_ID
      
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Check and Replace Theme'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='
          if [ -d "/var/www/html/wp-content/themes/$_THEME_NAME" ]; then
            echo "Theme '$_THEME_NAME' exists. Replacing with the new version...";
            sudo rm -rf "/var/www/html/wp-content/themes/$_THEME_NAME";
          else
            echo "Theme '$_THEME_NAME' does not exist. Proceeding to extract...";
          fi
          sudo mkdir -p "/var/www/html/wp-content/themes/$_THEME_NAME";
          sudo tar -xzf theme-archive.tar.gz -C "/var/www/html/wp-content/themes/$_THEME_NAME";
          rm theme-archive.tar.gz;
        '


    # Final Step: Check if wp-config.php exists, and if not, configure it
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Configure wp-config.php'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='
          if [ ! -f "/var/www/html/wp-config.php" ]; then
            echo "wp-config.php does not exist. Creating and configuring...";
            sudo cp "/var/www/html/wp-config-sample.php" "/var/www/html/wp-config.php";
            
            # Use sed with sudo to replace database details placeholders
            sudo sed -i "s/database_name_here/$_DB_NAME/g" "/var/www/html/wp-config.php";
            sudo sed -i "s/username_here/$_DB_USER/g" "/var/www/html/wp-config.php";
            sudo sed -i "s/password_here/$_DB_PASSWORD/g" "/var/www/html/wp-config.php";
            sudo sed -i "s/localhost/$_DB_HOST/g" "/var/www/html/wp-config.php";

            # Insert HTTPS check and FS_METHOD directive before the "stop editing" line
            sudo sed -i "/\/\* That\\'s all, stop editing! Happy publishing. \*\//i if (isset(\$_SERVER[\\'HTTP_X_FORWARDED_PROTO\\']) \&\& \$_SERVER[\\'HTTP_X_FORWARDED_PROTO\\'] === \\'https\\') {\\n    \$_SERVER[\\'HTTPS\\'] = \\'on\\';\\n}\\ndefine(\\'FS_METHOD\\', \\'direct\\');\\n" "/var/www/html/wp-config.php";
          else
            echo "wp-config.php already exists. Skipping configuration.";
          fi
        '

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Set Ownership and Permissions'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh $_GCE_USERNAME@$_INSTANCE_NAME --zone=$_ZONE --command='
          sudo chown -R www-data:www-data /var/www/html/wp-content && \
          sudo chmod -R 755 /var/www/html/wp-content
        '

timeout: '1600s'  

options:
  logging: CLOUD_LOGGING_ONLY

tags: 
 - master